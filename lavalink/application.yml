server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false  # Handled by youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 1000
    frameBufferDurationMs: 2000
    playerUpdateInterval: 10
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # MUSIC: search only (no sig extraction needed, most reliable)
    # ANDROID_MUSIC: playback (no sig extraction needed)
    # ANDROID_VR: playback fallback (no sig extraction needed)
    # WEB is excluded — requires signature cipher extraction which YouTube frequently breaks
    clients:
      - MUSIC
      - ANDROID_MUSIC
      - ANDROID_VR
    clientOptions:
      MUSIC:
        playback: false
        videoLoading: false

logging:
  level:
    root: INFO
    lavalink: INFO
