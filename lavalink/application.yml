server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false  # Handled by youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 1000
    frameBufferDurationMs: 2000
    playerUpdateInterval: 10
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # MUSIC: search only — YouTube Music client, reliable for lookups
    # TV_EMBEDDED: playback primary — TV embedded player, most stable against YouTube bot detection
    # IOS: playback fallback — Apple client, lower block rate than Android clients
    # ANDROID_MUSIC / ANDROID_VR excluded — YouTube has been blocking these since early 2025
    # WEB excluded — requires signature cipher extraction which YouTube frequently breaks
    clients:
      - MUSIC
      - TV_EMBEDDED
      - IOS
    clientOptions:
      MUSIC:
        playback: false
        videoLoading: false

logging:
  level:
    root: INFO
    lavalink: INFO
