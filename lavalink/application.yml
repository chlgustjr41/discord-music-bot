server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      youtube: false  # Handled by youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 1000
    frameBufferDurationMs: 2000
    playerUpdateInterval: 10
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Client order = priority. MUSIC is search-only (no playback).
    # TV_EMBEDDED + IOS are the most bot-detection-resistant unauthenticated clients.
    # OAuth makes all requests appear as a real logged-in user — required for GCP IPs.
    clients:
      - MUSIC
      - TV_EMBEDDED
      - IOS
    clientOptions:
      MUSIC:
        playback: false
        videoLoading: false
    oauth:
      enabled: true
      # On first start with no stored token, Lavalink prints a device-code URL to logs.
      # Visit https://www.google.com/device and enter the code to authenticate.
      # The token is saved to /opt/Lavalink/tokens.json inside the container.
      skipInitialization: false

logging:
  level:
    root: INFO
    lavalink: INFO
