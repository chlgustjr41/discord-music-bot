server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube's player JS changes every ~1-2 weeks and breaks signature
    # extraction in older plugin versions. This commit hash is the same commit
    # as the 1.18.1 release tag (May 3, 2026) — pinned by hash from the
    # snapshots repo. NOTE: snapshot artifacts can be purged upstream; if this
    # download ever 404s, switch to the identical stable release:
    #   dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
    #   repository: "https://maven.lavalink.dev/releases"
    #
    # When tracks start failing with "Must find sig function from script" in
    # logs, bump this hash to whatever is current at:
    #   https://maven.lavalink.dev/snapshots/dev/lavalink/youtube/youtube-plugin/
    - dependency: "dev.lavalink.youtube:youtube-plugin:9d4dbeeb51f16d53078486d69d27654d4acfa7fb"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
  server:
    password: "youshallnotpass"
    sources:
      youtube: false  # Handled by youtube-plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 1000
    frameBufferDurationMs: 2000
    playerUpdateInterval: 10
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Client roles (per youtube-source 1.18.x capability table):
    #   MUSIC            - search-only, ytmsearch:/ytsearch: prefix (playback disabled below)
    #   TVHTML5_SIMPLY   - Video + Search + Mix metadata, NO OAuth needed, uses TV-class
    #                      IP reputation. This is what carries playback on GCP datacenter
    #                      IPs. Placed FIRST so it owns video-URL loads before the
    #                      WEB-family clients hit YouTube's "requires login" wall.
    #   WEB              - Video/Search/Playlist/Mix metadata. Fails with "requires login"
    #                      on GCP IPs but kept as a fallback for fresh-IP windows and to
    #                      provide Playlist support TVHTML5_SIMPLY lacks.
    #   WEBEMBEDDED      - Video metadata, partial age-restriction handling.
    #   ANDROID_VR       - Video/Search/Playlist/Mix metadata, mobile fallback.
    #   TV               - Playback-only (Metadata Support: None per docs). Carries the
    #                      OAuth refresh token to stream sign-in-gated tracks once another
    #                      client has resolved the metadata. Useless alone.
    #
    # Why "TV alone doesn't work": TV's metadata support is None. If every metadata-capable
    # client fails the initial load (as happens on GCP without TVHTML5_SIMPLY), TV's OAuth
    # never gets a chance — the request fails before streaming would begin. This is the
    # root cause of the recurring "every track fails after a few days" outage: OAuth was
    # healthy, but the codepath that needs it was unreachable.
    #
    # Order matters: Lavalink tries clients top-to-bottom until one resolves.
    clients:
      - MUSIC
      - TVHTML5_SIMPLY
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
      - TV
    clientOptions:
      MUSIC:
        # MUSIC client cannot resolve playable streams in 1.18.0 — pin it to
        # search-only so Lavalink doesn't waste a try on it during playback.
        playback: false
        videoLoading: false
    # OAuth makes YouTube treat requests as a real signed-in user, sidestepping
    # the IP-reputation checks that block GCP/AWS IPs. Required for reliable
    # playback on cloud-hosted Lavalink.
    #
    # Google revokes these refresh tokens periodically. When that happens, ALL
    # track loads fail with "This video requires login" and the OAuth poller
    # spams "Invalid status code for oauth2 token fetch: 400" every 5 seconds.
    # Recovery: run scripts/reauth-youtube.sh on the host (see that file).
    #
    # The token is sourced from the container env, NOT from a tokens.json file.
    # That avoids the previous bug where Docker created a directory at the
    # bind-mount target on a fresh git pull (since the file didn't exist on
    # disk anymore), which then prevented Lavalink from starting.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: false

logging:
  level:
    root: INFO
    lavalink: INFO
