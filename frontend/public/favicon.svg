<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5C68F3"/>
      <stop offset="100%" stop-color="#3C45A5"/>
    </linearGradient>
  </defs>

  <!-- Discord blurple rounded-square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle top highlight for depth -->
  <ellipse cx="180" cy="72" rx="220" ry="76" fill="white" fill-opacity="0.06"/>

  <!-- Bold J -->
  <text
    x="75"
    y="330"
    font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
    font-size="270"
    font-weight="900"
    fill="white"
  >J</text>

  <!-- Eighth note (♪) — note head + stem + flag, drawn as geometry -->
  <!-- Note head: slightly tilted ellipse -->
  <ellipse cx="325" cy="328" rx="40" ry="27" fill="white" transform="rotate(-22 325 328)"/>
  <!-- Stem: right edge of note head up to top -->
  <line x1="358" y1="313" x2="358" y2="106" stroke="white" stroke-width="18" stroke-linecap="round"/>
  <!-- Flag: single curve sweeping right and returning to stem -->
  <path d="M 358,106 C 440,90 442,192 358,212" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
