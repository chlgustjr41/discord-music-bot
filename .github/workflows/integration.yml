name: Integration

on:
  pull_request:
    paths:
      - "services/**"
      - "deploy/**"
      - ".github/workflows/integration.yml"
  schedule:
    # Daily canary: the soft-gated live-mint steps below only produce signal
    # when they actually run; PRs alone can go quiet for days.
    - cron: "0 9 * * *"
  # Manual runs for verifying workflow changes without waiting a day.
  workflow_dispatch:

# Least privilege for the workflow token: the job only reads the repo.
permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env
      - name: Set the runner's Docker socket group
        # .env.example carries a placeholder (DOCKER_GID=0). socket-proxy runs
        # unprivileged and can only open /var/run/docker.sock as a member of
        # the group that owns it on THIS machine — same as on a real host.
        run: |
          gid=$(stat -c %g /var/run/docker.sock)
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=${gid}/" deploy/.env
          grep -qx "DOCKER_GID=${gid}" deploy/.env
      - name: Boot audio infrastructure
        run: $COMPOSE up -d --build lavalink pot-provider token-minter
      - name: Guardian boots and probes (hard gate)
        # No secrets needed: alerts fail soft against the placeholder webhook;
        # what we prove is startup + a completed probe tick against the stack.
        run: |
          $COMPOSE up -d --build guardian
          for i in $(seq 1 12); do
            $COMPOSE logs guardian | grep -q "guardian 2.0.0 started" && exit 0
            sleep 5
          done
          $COMPOSE logs guardian
          exit 1
      - name: Socket-proxy policy (hard gate)
        # Proves the allowlist in deploy/docker-compose.yml, from inside the
        # guardian container because that is the only client the proxy
        # accepts (-allowfrom=guardian). The two calls the guardian makes must
        # get through; everything else must be refused BY THE PROXY (403). A
        # 2xx — or a 404, which is Docker answering — means the request
        # reached the daemon, and the gate fails.
        # The restart rule is exercised with an id no container has, so a
        # pass is Docker's own 404 and nothing is actually restarted.
        # Read-only: it does not disturb the mint that the next steps time.
        run: |
          $COMPOSE exec -T guardian python - <<'PY' || { $COMPOSE logs socket-proxy; exit 1; }
          import sys
          import urllib.error
          import urllib.request

          BASE = "http://socket-proxy:2375"
          NO_SUCH_ID = "0" * 12

          def call(method, path):
              body = b"" if method == "POST" else None
              req = urllib.request.Request(BASE + path, data=body, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return resp.status
              except urllib.error.HTTPError as exc:
                  return exc.code
              except OSError as exc:
                  return f"no connection ({exc})"

          def refused(status):
              return status == 403 or str(status).startswith("no connection")

          CHECKS = [
              # (method, path, verdict wanted, test on the status)
              ("GET", "/containers/json", "ALLOWED", lambda s: s == 200),
              # The shape the guardian really sends: the query string must not
              # change the verdict.
              ("GET", "/containers/json?all=true", "ALLOWED", lambda s: s == 200),
              ("POST", f"/containers/{NO_SUCH_ID}/restart?t=10", "ALLOWED", lambda s: s == 404),
              ("POST", "/containers/create", "REFUSED", refused),
              ("GET", "/images/json", "REFUSED", refused),
              ("POST", "/containers/x/exec", "REFUSED", refused),
              # Inspect would hand over every container's environment.
              ("GET", f"/containers/{NO_SUCH_ID}/json", "REFUSED", refused),
              # Only the unversioned paths the guardian uses are open.
              ("GET", "/v1.41/containers/json", "REFUSED", refused),
          ]

          failed = False
          for method, path, wanted, ok in CHECKS:
              status = call(method, path)
              good = ok(status)
              failed = failed or not good
              print(f"{'ok  ' if good else 'FAIL'} want {wanted:7} {method:4} {path} -> {status}")
          sys.exit(1 if failed else 0)
          PY
      - name: Wait for lavalink healthy
        run: |
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' $($COMPOSE ps -q lavalink))
            [ "$state" = "healthy" ] && exit 0
            sleep 5
          done
          $COMPOSE logs lavalink
          exit 1
      - name: Minter completed a cycle
        # Soft gate on PRs: requires live Google egress from a datacenter IP;
        # failure is signal, not a merge blocker (review I2). HARD on the
        # daily schedule run — that is the canary, and it must turn red when
        # Google-side minting breaks.
        # MUST run before the synthetic-injection step: that step stops the
        # minter and restarts lavalink, and a first mint takes ~15-30s
        # (ADR-0004). When runners sped up in mid-August 2026 the injection
        # step began firing ~12s after the minter started, killing the cycle
        # mid-push every run — the canary was red daily 08-11..08-21 with
        # minting itself perfectly healthy. Gating here, while the stack is
        # untouched, times the mint and nothing else.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          for i in $(seq 1 24); do
            $COMPOSE logs token-minter | grep -q "minted and pushed" && exit 0
            sleep 5
          done
          $COMPOSE logs token-minter pot-provider
          exit 1
      - name: Cold-start injection (synthetic tokens, hard gate)
        # Proves the entrypoint injection path with zero live egress: seed a
        # synthetic tokens.env into the volume and check the rendered config.
        run: |
          # Stop the minter while the synthetic file is in play so a retrying
          # real mint can't overwrite it mid-check; the real-token step below
          # restarts it anyway.
          $COMPOSE stop token-minter
          vol=$(docker volume ls -q | grep jacky-music_tokens)
          # Written as root, while the minter itself runs as uid 10001. That is
          # fine in both directions: lavalink only needs the file readable
          # (0644 here), and the minter never opens this file for writing — it
          # replaces it by temp-file + rename, which needs write access to the
          # DIRECTORY (its own) and not to the file being replaced.
          docker run --rm -v "$vol":/data/tokens alpine sh -c 'printf "POT_TOKEN=SYNTHPO123\nPOT_VISITOR_DATA=SYNTHVD456\n" > /data/tokens/tokens.env'
          $COMPOSE restart lavalink
          healthy=false
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' $($COMPOSE ps -q lavalink)); [ "$state" = "healthy" ] && healthy=true && break; sleep 5
          done
          if [ "$healthy" != "true" ]; then $COMPOSE logs lavalink; exit 1; fi
          $COMPOSE exec -T lavalink sh -c 'grep -q "SYNTHPO123" /tmp/application.yml && ! grep -q "__POT_TOKEN__" /tmp/application.yml'
      - name: Cold-start injection (real minted token)
        # Soft on PRs, hard on the daily canary run — see the minter-cycle
        # step above.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          # The synthetic step overwrote tokens.env; restarting the minter
          # forces an immediate fresh mint so the volume holds a real token.
          $COMPOSE restart token-minter
          tok=""
          for i in $(seq 1 24); do
            tok=$($COMPOSE exec -T token-minter sh -c 'grep "^POT_TOKEN=" /data/tokens/tokens.env 2>/dev/null | cut -d= -f2-' || true)
            [ -n "$tok" ] && [ "$tok" != "SYNTHPO123" ] && break
            sleep 5
          done
          if [ -z "$tok" ] || [ "$tok" = "SYNTHPO123" ]; then
            $COMPOSE logs token-minter pot-provider
            exit 1
          fi
          $COMPOSE restart lavalink
          healthy=false
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' $($COMPOSE ps -q lavalink)); [ "$state" = "healthy" ] && healthy=true && break; sleep 5
          done
          if [ "$healthy" != "true" ]; then $COMPOSE logs lavalink; exit 1; fi
          # Assert the ACTUAL minted value landed in the rendered config (M3).
          $COMPOSE exec -T lavalink sh -c "grep -qF 'token: \"$tok\"' /tmp/application.yml"
      - if: always()
        run: $COMPOSE down -v
