name: Integration

on:
  pull_request:
    paths:
      - "services/**"
      - "deploy/**"
      - ".github/workflows/integration.yml"
  schedule:
    # Daily canary: the soft-gated live-mint steps below only produce signal
    # when they actually run; PRs alone can go quiet for days.
    - cron: "0 9 * * *"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env
      - name: Boot audio infrastructure
        run: $COMPOSE up -d --build lavalink pot-provider token-minter
      - name: Guardian boots and probes (hard gate)
        # No secrets needed: alerts fail soft against the placeholder webhook;
        # what we prove is startup + a completed probe tick against the stack.
        run: |
          $COMPOSE up -d --build guardian
          for i in $(seq 1 12); do
            $COMPOSE logs guardian | grep -q "guardian 2.0.0 started" && exit 0
            sleep 5
          done
          $COMPOSE logs guardian
          exit 1
      - name: Wait for lavalink healthy
        run: |
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' $($COMPOSE ps -q lavalink))
            [ "$state" = "healthy" ] && exit 0
            sleep 5
          done
          $COMPOSE logs lavalink
          exit 1
      - name: Cold-start injection (synthetic tokens, hard gate)
        # Proves the entrypoint injection path with zero live egress: seed a
        # synthetic tokens.env into the volume and check the rendered config.
        run: |
          # Stop the minter while the synthetic file is in play so a retrying
          # real mint can't overwrite it mid-check; the real-token step below
          # restarts it anyway.
          $COMPOSE stop token-minter
          vol=$(docker volume ls -q | grep jacky-music_tokens)
          docker run --rm -v "$vol":/data/tokens alpine sh -c 'printf "POT_TOKEN=SYNTHPO123\nPOT_VISITOR_DATA=SYNTHVD456\n" > /data/tokens/tokens.env'
          $COMPOSE restart lavalink
          healthy=false
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' $($COMPOSE ps -q lavalink)); [ "$state" = "healthy" ] && healthy=true && break; sleep 5
          done
          if [ "$healthy" != "true" ]; then $COMPOSE logs lavalink; exit 1; fi
          $COMPOSE exec -T lavalink sh -c 'grep -q "SYNTHPO123" /tmp/application.yml && ! grep -q "__POT_TOKEN__" /tmp/application.yml'
      - name: Minter completed a cycle
        # Soft gate on PRs: requires live Google egress from a datacenter IP;
        # failure is signal, not a merge blocker (review I2). HARD on the
        # daily schedule run — that is the canary, and it must turn red when
        # Google-side minting breaks.
        # 120s ceiling is enough because token-minter's depends_on gates on a
        # healthy pot-provider, so the first cycle no longer loses the boot
        # race (a real mint takes ~15-30s, ADR-0004).
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          for i in $(seq 1 24); do
            $COMPOSE logs token-minter | grep -q "minted and pushed" && exit 0
            sleep 5
          done
          $COMPOSE logs token-minter pot-provider
          exit 1
      - name: Cold-start injection (real minted token)
        # Soft on PRs, hard on the daily canary run — see the previous step.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: |
          # The synthetic step overwrote tokens.env; restarting the minter
          # forces an immediate fresh mint so the volume holds a real token.
          $COMPOSE restart token-minter
          tok=""
          for i in $(seq 1 24); do
            tok=$($COMPOSE exec -T token-minter sh -c 'grep "^POT_TOKEN=" /data/tokens/tokens.env 2>/dev/null | cut -d= -f2-' || true)
            [ -n "$tok" ] && [ "$tok" != "SYNTHPO123" ] && break
            sleep 5
          done
          if [ -z "$tok" ] || [ "$tok" = "SYNTHPO123" ]; then
            $COMPOSE logs token-minter pot-provider
            exit 1
          fi
          $COMPOSE restart lavalink
          healthy=false
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' $($COMPOSE ps -q lavalink)); [ "$state" = "healthy" ] && healthy=true && break; sleep 5
          done
          if [ "$healthy" != "true" ]; then $COMPOSE logs lavalink; exit 1; fi
          # Assert the ACTUAL minted value landed in the rendered config (M3).
          $COMPOSE exec -T lavalink sh -c "grep -qF 'token: \"$tok\"' /tmp/application.yml"
      - if: always()
        run: $COMPOSE down -v
