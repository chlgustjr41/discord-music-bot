[project]
name = "jacky-voice-listener"
version = "0.1.0"
description = "Jacky Ears — wake-word voice control companion"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4",
    # Pinned to an exact pre-release: this project publishes ONLY alphas, and
    # pip won't match a `>=0.5` spec against pre-releases in a clean build
    # (the wheel resolves locally only when already cached). Bump deliberately.
    "discord-ext-voice-recv==0.5.2a179",
    "vosk>=0.3.45",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
