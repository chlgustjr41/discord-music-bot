services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: jacky-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - _JAVA_OPTIONS=-Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=10
      # Sourced from .env. Empty on first start triggers the device-code OAuth
      # flow (URL printed in container logs); set after authenticating to
      # persist the session across restarts. NOT a file mount — see the comment
      # in lavalink/application.yml for why.
      - YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
    # When the OAuth token dies, the youtube plugin logs a stack trace every
    # 5 seconds forever. Without rotation that grew to a 6M-line log that made
    # the device-code prompt impossible to find. Cap it.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  jacky-bot:
    build: ./bot
    container_name: jacky-bot
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file:
      - .env
    environment:
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=youshallnotpass
    volumes:
      - ./bot:/app
      - /var/run/docker.sock:/var/run/docker.sock
