name: jacky-music

services:
  lavalink:
    build: ../services/lavalink
    restart: unless-stopped
    # Rotation is load-bearing: a revoked OAuth token (playbook F2) makes the
    # youtube plugin log errors every 5s; unbounded logs once filled the VM disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      _JAVA_OPTIONS: "-Xmx${LAVALINK_HEAP:-512m}"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?set in .env}
      YOUTUBE_PLUGIN_VERSION: ${YOUTUBE_PLUGIN_VERSION:?set in .env}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
      YOUTUBE_REMOTE_CIPHER_URL: ${YOUTUBE_REMOTE_CIPHER_URL:-http://cipher:8001}
      YOUTUBE_REMOTE_CIPHER_PASSWORD: ${YOUTUBE_REMOTE_CIPHER_PASSWORD:?set in .env}
    expose:
      - "2333"
    volumes:
      - tokens:/data/tokens:ro
    # curl is present in the image (verified in ADR-0004). $$ escapes compose
    # interpolation; CMD-SHELL (not exec-form CMD) is required so the env var
    # actually expands inside the container.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: $${LAVALINK_SERVER_PASSWORD}\" http://localhost:2333/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [jacky]

  bot:
    build: ../services/bot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set in .env}
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set in .env}
      FIREBASE_SERVICE_ACCOUNT_KEY: /run/secrets/firebase-service-account.json
      WEB_APP_URL: ${WEB_APP_URL:?set in .env}
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:?set in .env}:/run/secrets/firebase-service-account.json:ro
    expose:
      - "8080"
    depends_on:
      lavalink:
        condition: service_healthy
    networks: [jacky]

  guardian:
    build: ../services/guardian
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set in .env}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?set in .env}
      BOT_HEALTH_URL: http://bot:8080/health
      # Must match the compose project (top-level `name:`) — restart targeting
      # filters containers by the com.docker.compose.project label.
      COMPOSE_PROJECT: jacky-music
      YOUTUBE_PLUGIN_VERSION: ${YOUTUBE_PLUGIN_VERSION:?set in .env}
      PROBE_INTERVAL_SECONDS: ${PROBE_INTERVAL_SECONDS:-120}
    expose:
      - "8081"  # /status, consumed by the bot's j!status command
    volumes:
      # Root-equivalent access to the host, accepted by design (spec §3.4):
      # guardian uses it only to restart sibling services (playbook F4/F5).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - lavalink
    networks: [jacky]

  cipher:
    # Remote signature/n-function deciphering for the youtube plugin (playbook
    # F3 escalation, 2026-07-10): executes YouTube's player JS instead of
    # regex-parsing it, so player rollouts that break the plugin's
    # LocalSignatureCipherManager don't take playback down.
    # Deliberately UNPINNED (:master, upstream publishes no version tags): a
    # cipher server only works while it tracks YouTube's player changes — a
    # stale pin here recreates the very outage this service exists to absorb.
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      API_TOKEN: ${YOUTUBE_REMOTE_CIPHER_PASSWORD:?set in .env}
      # IAS is the only variant upstream marks as consistently working.
      OVERRIDE_PLAYER_VARIANT: IAS
      # 2GB-VM budget (spec §2): single worker, small player-script cache.
      MAX_THREADS: "1"
      PREPROCESSED_CACHE_SIZE: "20"
    expose:
      - "8001"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [jacky]

  pot-provider:
    # Pinned like YOUTUBE_PLUGIN_VERSION: bump deliberately, in step with
    # youtube-source plugin compatibility (ADR-0004).
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-node
    restart: unless-stopped
    init: true
    expose:
      - "4416"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [jacky]

  token-minter:
    build: ../services/token-minter
    restart: unless-stopped
    environment:
      POT_PROVIDER_URL: http://pot-provider:4416
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set in .env}
      POT_REFRESH_HOURS: ${POT_REFRESH_HOURS:-5.5}
    volumes:
      - tokens:/data/tokens
    depends_on:
      # A mint cycle is mint (pot-provider) + push (lavalink REST), so BOTH
      # dependencies must be healthy or the first cycle loses a boot race and
      # the poToken layer stays dark for the whole 300s retry window.
      # service_started was not enough for lavalink: the container exists long
      # before the JVM listens on 2333 (daily Integration canary red since
      # 2026-07-04 with "Cannot connect to host lavalink:2333").
      lavalink:
        condition: service_healthy
      pot-provider:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [jacky]

networks:
  jacky: {}

volumes:
  tokens: {}
