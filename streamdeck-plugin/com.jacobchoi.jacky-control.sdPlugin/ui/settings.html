<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
  <style>
    #auth-status {
      color: #d8d8d8;
      font-family: inherit;
      font-size: 9pt;
      margin: 4px 0 2px 0;
      padding-left: 4px;
    }
    #summon-error { color: #e94560; }
  </style>
</head>
<body>
  <!-- Global: one sign-in shared by every key. -->
  <div id="auth-status">Checking sign-in…</div>
  <sdpi-item label="Account">
    <sdpi-button id="sign-in">Sign in with Discord</sdpi-button>
  </sdpi-item>
  <sdpi-item label="Server URL">
    <sdpi-textfield global setting="apiUrl" placeholder="https://control.jacky-music-bot.com"></sdpi-textfield>
  </sdpi-item>

  <!-- Play/Pause key only: what this key displays. Both default off, so a key
       nobody reconfigured keeps showing only its play/pause glyph. -->
  <div id="play-pause-settings" style="display: none">
    <sdpi-item label="Display">
      <sdpi-checkbox setting="showTitle" label="Show track title"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item>
      <sdpi-checkbox setting="showArtwork" label="Show artwork"></sdpi-checkbox>
    </sdpi-item>
  </div>

  <!-- Summon key only: which voice channel this key joins/leaves. -->
  <div id="summon-settings" style="display: none">
    <sdpi-item label="Server">
      <sdpi-select id="guild-select" setting="guildId" placeholder="Select a server"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Voice channel">
      <sdpi-select id="channel-select" setting="channelId" placeholder="Select a channel"></sdpi-select>
    </sdpi-item>
    <div id="summon-error" class="hidden" style="display: none; padding-left: 4px; font-size: 9pt"></div>
  </div>

  <!-- Playlist key only: which saved playlist this key loads. -->
  <div id="playlist-settings" style="display: none">
    <sdpi-item label="Server">
      <sdpi-select id="pl-guild-select" setting="guildId" placeholder="Select a server"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Playlist">
      <sdpi-select id="pl-select" setting="playlistName" placeholder="Select a playlist"></sdpi-select>
    </sdpi-item>
    <div id="playlist-error" style="display: none; padding-left: 4px; font-size: 9pt; color: #e94560"></div>
  </div>

  <!-- Voice key only: which microphone to record from, and which language to
       transcribe as. The language list must stay in step with LANGUAGES in
       services/bot/src/jacky/api/transcribe.py — a code the server does not
       know degrades to English, which looks like a bad microphone.
       `default="en"` makes English the stored value for a key nobody
       configured, so no key ever sends an empty code. -->
  <div id="voice-settings" style="display: none">
    <sdpi-item label="Microphone">
      <sdpi-select id="mic-select" setting="inputDevice" placeholder="System default"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Language">
      <sdpi-select id="language-select" setting="language" default="en">
        <option value="en">English</option>
        <option value="ko">한국어 / Korean</option>
        <option value="ja">日本語 / Japanese</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="zh">中文</option>
      </sdpi-select>
    </sdpi-item>
    <div id="voice-error" style="display: none; padding-left: 4px; font-size: 9pt; color: #e94560"></div>
  </div>

  <script>
    // sdpi-components v3/v4 exposes window.SDPIComponents.streamDeckClient:
    //  - send(event, payload): raw websocket send with action/context filled in;
    //    PI -> plugin messages therefore go via send("sendToPlugin", payload).
    //  - sendToPropertyInspector: event emitter; subscribers receive the full
    //    websocket message, our data is in message.payload.
    //  - getConnectionInfo(): resolves { actionInfo, info } (actionInfo.action
    //    is this key's action UUID).
    const client = SDPIComponents.streamDeckClient;
    const statusEl = document.getElementById("auth-status");
    const signInBtn = document.getElementById("sign-in");
    const playPauseDiv = document.getElementById("play-pause-settings");
    const summonDiv = document.getElementById("summon-settings");
    const guildSelect = document.getElementById("guild-select");
    const channelSelect = document.getElementById("channel-select");
    const summonError = document.getElementById("summon-error");
    const playlistDiv = document.getElementById("playlist-settings");
    const plGuildSelect = document.getElementById("pl-guild-select");
    const plSelect = document.getElementById("pl-select");
    const playlistError = document.getElementById("playlist-error");
    const voiceDiv = document.getElementById("voice-settings");
    const micSelect = document.getElementById("mic-select");
    const voiceError = document.getElementById("voice-error");

    let channelData = []; // [{guildId, guildName, channels: [{id, name}]}]
    let isSummon = false;
    let playlistData = []; // [{guildId, guildName, playlists: [{name, trackCount}]}]
    let isPlaylist = false;
    let isVoice = false;

    const sendToPlugin = (payload) => client.send("sendToPlugin", payload);

    function setOptions(select, items) {
      // sdpi-select watches its light-DOM <option> children via a
      // MutationObserver, so replacing them re-renders the control and
      // re-applies the persisted setting value.
      select.querySelectorAll("option").forEach((o) => o.remove());
      for (const { value, label } of items) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = label;
        select.appendChild(opt);
      }
    }

    function refreshChannelOptions() {
      const guild = channelData.find((g) => g.guildId === guildSelect.value);
      setOptions(
        channelSelect,
        (guild ? guild.channels : []).map((c) => ({ value: c.id, label: c.name })),
      );
    }

    guildSelect.addEventListener("valuechange", refreshChannelOptions);

    function refreshPlaylistOptions() {
      const g = playlistData.find((x) => x.guildId === plGuildSelect.value);
      setOptions(
        plSelect,
        (g ? g.playlists : []).map((p) => ({
          value: p.name,
          label: `${p.name} (${p.trackCount})`,
        })),
      );
    }

    plGuildSelect.addEventListener("valuechange", refreshPlaylistOptions);

    client.sendToPropertyInspector.subscribe((message) => {
      const p = message.payload;
      if (!p || !p.event) return;
      if (p.event === "auth-status") {
        signInBtn.disabled = false;
        statusEl.textContent = p.ok
          ? "Signed in as " + (p.userName || "Discord user")
          : p.error
            ? "Sign-in failed: " + p.error
            : "Not signed in";
        if (p.ok && isSummon) sendToPlugin({ event: "get-channels" });
        if (p.ok && isPlaylist) sendToPlugin({ event: "get-playlists" });
      } else if (p.event === "channels") {
        summonError.style.display = "none";
        channelData = p.data || [];
        setOptions(
          guildSelect,
          channelData.map((g) => ({ value: g.guildId, label: g.guildName })),
        );
        refreshChannelOptions();
      } else if (p.event === "channels-error") {
        summonError.textContent = "Could not load channels: " + (p.error || "unknown error");
        summonError.style.display = "block";
      } else if (p.event === "playlists") {
        playlistError.style.display = "none";
        playlistData = p.data || [];
        setOptions(
          plGuildSelect,
          playlistData.map((g) => ({ value: g.guildId, label: g.guildName })),
        );
        refreshPlaylistOptions();
      } else if (p.event === "playlists-error") {
        playlistError.textContent = "Could not load playlists: " + (p.error || "unknown error");
        playlistError.style.display = "block";
      } else if (p.event === "audio-devices") {
        voiceError.style.display = "none";
        setOptions(micSelect, (p.data || []).map((d) => ({ value: d, label: d })));
      } else if (p.event === "audio-devices-error") {
        voiceError.textContent = "Could not list microphones: " + (p.error || "unknown error");
        voiceError.style.display = "block";
      }
    });

    signInBtn.addEventListener("click", () => {
      signInBtn.disabled = true;
      statusEl.textContent = "Waiting for sign-in in your browser…";
      sendToPlugin({ event: "sign-in" });
    });

    (async () => {
      const { actionInfo } = await client.getConnectionInfo();
      // Nothing to fetch: both are plain per-key booleans the components
      // persist themselves.
      if (actionInfo.action.endsWith(".play-pause")) playPauseDiv.style.display = "";
      isSummon = actionInfo.action.endsWith(".summon");
      if (isSummon) {
        summonDiv.style.display = "";
        sendToPlugin({ event: "get-channels" });
      }
      isPlaylist = actionInfo.action.endsWith(".playlist");
      if (isPlaylist) {
        playlistDiv.style.display = "";
        sendToPlugin({ event: "get-playlists" });
      }
      // Not gated on sign-in: the device list comes from the local ffmpeg,
      // not the bot, so it is never re-requested on auth-status.
      isVoice = actionInfo.action.endsWith(".voice");
      if (isVoice) {
        voiceDiv.style.display = "";
        sendToPlugin({ event: "get-audio-devices" });
      }
      sendToPlugin({ event: "get-status" });
    })();
  </script>
</body>
</html>
